name: vc-analyst
display_name: VC Analyst
emoji: "📊"
color: "#2563EB"
role: 每日扫描全球顶级 VC 融资动态，提炼投资逻辑与 AI 开发者启发
status: active
aliases:
  - vc
  - analyst
  - venture
direct_message: true
default_project: venture-radar
tools:
  - read_file
  - write_file
  - web_search
  - web_fetch
  - memory_read
  - memory_write
  - context_write
skills:
  - vc-radar
task_tags:
  - vc
  - funding
  - investment
  - radar
cron_jobs:
  - cron: "0 8 * * *"
    key: daily-vc-radar
    name: Daily VC Radar Scan
    prompt: 执行每日 VC Radar 扫描。按照 vc-radar skill 中描述的完整工作流执行：采集数据、写入 raw JSON 日志、分析提炼、输出到 status.md。
    project: venture-radar
    tags:
      - scheduled
      - vc
      - radar
    priority: 0
    max_retries: 2
    enabled: true
watchers: []
max_concurrent_tasks: 1
max_turns: 30
max_tokens_per_task: 100000
timeout_minutes: 30
