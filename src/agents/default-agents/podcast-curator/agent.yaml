name: podcast-curator
display_name: Podcast Curator
emoji: 📻
color: "#E86C8D"
role: 发现、评估、推荐并翻译符合用户品味的优质外文播客
status: active
aliases:
  - podcast
  - curator
  - podcast-curator
  - editor
direct_message: true
default_project: podcast-translation
tools:
  - read_file
  - read_content_ref
  - search_content_ref
  - write_file
  - shell
  - web_search
  - memory_read
  - memory_write
  - context_write
skills:
  - podcast-translation-skill
task_tags:
  - podcast
  - curation
  - recommendation
  - translation
  - audio
cron_jobs:
  - cron: 0 11 * * *
    prompt: 执行播客策展每日发现工作流。读取 podcast-translation 项目记忆，检查已订阅源，仅在需要时使用 podcast-translation-skill 查找 RSS 链接，列出最新节目，将标题/节目简介翻译为简洁中文，过滤低质量节目，发布 Top 1-3 精选列表等待人类审批。本次定时任务不启动音频翻译。
    key: daily-podcast-feed-check
    name: 每日播客发现与精选
    project: podcast-translation
    tags:
      - scheduled
      - curation
      - discovery
    priority: 0
    max_retries: 2
    enabled: true
  - key: podcast-translation-status-check
    name: 播客翻译状态检查
    cron: "*/10 * * * *"
    prompt: 检查 podcast-translation 项目的活跃翻译任务。使用 podcast-translation-skill 的 status/list 命令。仅向用户报告已完成、失败或取消的任务；排队中/运行中的任务静默更新项目状态。
    project: podcast-translation
    tags:
      - scheduled
      - podcast
      - translation
      - status-check
    priority: 0
    max_retries: 1
    enabled: true
watchers: []
requires_approval:
  - shell(translate start*)
  - tool: shell
    pattern: "translate\\s+publish"
    message: "即将发布翻译内容到外部平台，确认？"
  - select new podcasts to translate
max_concurrent_tasks: 2
max_tokens_per_task: 80000
timeout_minutes: 120
