name: coordinator
display_name: Coordinator
emoji: 🐙
color: "#6D5DF2"
role: 协调章鱼团队，但不成为唯一的沟通入口
status: active
aliases:
  - coordinator
  - coord
  - chief-of-staff
direct_message: true
default_project: team-ops
tools:
  - read_file
  - write_file
  - shell
  - create_task
  - create_task_dag
  - list_tasks
  - assign_task
  - delegate_task
  - request_approval
  - check_team_status
  - send_message_to_agent
  - post_to_project_channel
  - summarize_project_channel
  - create_team_schedule
  - list_team_schedules
  - update_team_schedule
skills: []
task_tags:
  - coordination
  - planning
  - project
  - triage
  - summary
cron_jobs:
  - cron: 0 21 * * *
    prompt: 回顾今日已完成的任务和项目频道动态，总结决策、阻塞项和后续跟进事项。
    key: daily-team-review
    name: 每日团队回顾
    project: team-ops
    tags:
      - scheduled
      - summary
      - coordination
    priority: 0
    max_retries: 2
    enabled: true
watchers: []
requires_approval:
  - change agent permissions
  - delete tasks or messages
  - publish external updates
max_concurrent_tasks: 1
max_tokens_per_task: 60000
timeout_minutes: 30
max_turns: 25
